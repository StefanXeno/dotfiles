# ============================================================
# PLUGINS (managed by TPM — Tmux Plugin Manager)
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Install plugins: prefix + I
# Update plugins:  prefix + U
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'dracula/tmux'

# ============================================================
# DRACULA THEME CONFIG
# ============================================================

set -g @dracula-show-fahrenheit false
set -g @dracula-fixed-location "Augsburg"

# ============================================================
# SHELL
# ============================================================

set-option -g default-shell /bin/zsh

# ============================================================
# KEY BINDINGS
# ============================================================

# Change prefix from Ctrl+B to Ctrl+A (screen-style, easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes with | and - (way more intuitive than " and %)
# -c "#{pane_current_path}" opens the new pane in the same directory
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes with Alt+Arrow (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Rotate all panes (tmux default: C-o = forwards, M-o = backwards with -D)
# Important: -U is NOT the reverse direction — only -D reverses relative to the default.
bind -n M-S-Left  rotate-window -D
bind -n M-S-Right rotate-window
bind < rotate-window -D
bind > rotate-window

# Manually re-tile all panes (prefix + t)
# Overrides default "show clock" binding
bind t select-layout tiled

# Rename current window (prefix + r)
bind r command-prompt -I '#W' "rename-window '%%'"

# Reload config without restarting tmux (prefix + R)
bind R source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Scratchpad — floating popup shell (toggle: run again or exit the shell inside)
bind ` display-popup -E -w 80% -h 80%

# Enter copy mode (prefix + v) — vi-style
bind v copy-mode

# Synchronize input to all panes in current window (prefix + s)
# Useful for running the same command on multiple servers simultaneously
bind-key s set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# ============================================================
# COPY MODE
# ============================================================

# Use vi key bindings in copy mode (h/j/k/l, v to select, y to yank)
set-window-option -g mode-keys vi

# ============================================================
# AUTO LAYOUT
# ============================================================

# After splitting or killing a pane, redistribute space evenly
# without changing the split direction
set-hook -g after-split-window     'select-layout -E'
set-hook -g after-kill-pane        'select-layout -E'
set-hook -g pane-exited            'select-layout -E'
set-hook -g client-session-changed 'select-layout -E'

# ============================================================
# NOTIFICATIONS
# ============================================================

# tmux-notify calls notify-send on PATH — ensure ~/bin wrapper is visible (WSL → Windows toast)
set-environment -g PATH "$PATH:$HOME/bin:$HOME/.local/bin"

set -g @tnotify-prompt-suffixes 'λ,$,#,%%'
set -g @tnotify-verbose on
set -g @tnotify-verbose-title 'Tmux did something!'
set -g @tnotify-verbose-msg 'Tmux is done in Window #I with name #W'

# ============================================================
# GENERAL SETTINGS
# ============================================================

# Enable mouse support (click to select pane/window, scroll, resize)
set -g mouse on

# Large scrollback buffer (default is only 2000 lines — way too small)
set-option -g history-limit 200000

# ============================================================
# TPM INITIALIZATION
# Keep this line at the very bottom of tmux.conf!
# ============================================================
run '~/.tmux/plugins/tpm/tpm'