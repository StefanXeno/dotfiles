services:
  dotfiles-test:
    build:
      context: ..
      dockerfile: test/Dockerfile
      args:
        UBUNTU_VERSION: "24.04"
        USERNAME: stefan
        USER_UID: "1000"
        USER_GID: "1000"

    image: dotfiles-test:local

    container_name: dotfiles-test
    hostname: dotfiles-test-ubuntu

    # Read-only source: run.sh copies it to ~/dotfiles as the container user. A direct bind mount
    # would be owned by root in rootless Docker (host uid -> container root), which breaks
    # chmod, lazy.nvim's lockfile and git ("dubious ownership").
    volumes:
      - ..:/mnt/dotfiles-src:ro

    stdin_open: true
    tty: true
    command: sleep infinity