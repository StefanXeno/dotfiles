"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

[character]
success_symbol = '[λ](bold green)'
error_symbol   = '[λ](bold red)'

[status]
disabled = false
format   = '[$status]($style) '
style    = 'red'

[package]
disabled = true

[java]
disabled = true

# Shows the active mise-managed tool versions in the current directory.
# Only appears when a .mise.toml or .tool-versions file is detected,
# or when a tool-specific file is present (e.g. package.json, .python-version).
[mise]
format    = '[$version]($style) '
style     = 'bold yellow'
disabled  = false

[kubernetes]
disabled = false
format   = '[$symbol ]($style)[$context( \($namespace\))]($style) '
style    = 'cyan bold'

# Both custom modules below only show outside tmux: inside tmux the status bar shows them
# (zsh/bin/tmux-ai-status, tmux/.tmux.conf), and only while they exist.
# Claude Code 5-hour rate limit: "<used %> <time until reset>". Fed by `claude-usage record`
# (Claude Code statusLine, see ~/.claude/settings.json); empty output hides the module,
# i.e. when there has been no usage in the current window.
[custom.claude]
command = 'claude-usage show'
when    = '[ -z "${TMUX:-}" ]'
format  = '([✻ $output]($style) )'
style   = 'bold #d97757'
shell   = ['bash', '--noprofile', '--norc']

# Local AI: name of the model currently loaded in Ollama. Empty output (hidden) when
# Ollama is off or no model is loaded.
[custom.ollama]
command = 'ollama-ai active'
when    = '[ -z "${TMUX:-}" ]'
format  = '([󰧑 $output]($style) )'
style   = 'bold #7aa2f7'
shell   = ['bash', '--noprofile', '--norc']
