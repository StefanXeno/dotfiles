# Global mise config — applies on every machine.
# Project-specific tool versions go into <project>/.mise.toml
#
# Version policy:
#   - Infrastructure / daily-driver CLI tools: pinned (update deliberately)
#   - Misc / experimental tools: "latest" (see "Updating pinned tools" in README)
#
# Update a pin:  mise ls-remote <tool>   then edit version here and run mise install

[env]
# Let mise manage these paths so they're inserted in the correct
# order relative to mise tool paths — no more manual PATH export needed.
_.path = ["~/.local/bin","~/bin", "~/tools"]

[tools]
# --- Infrastructure (pinned) ---
terraform   = "1.15.6"
kind        = "0.32.0"
kubectl     = "1.36.2"
helm        = "4.2.2"
krew        = "0.5.0"
k9s         = "0.51.0"
kubectx     = "0.11.0"
kubens      = "0.11.0"
helm-docs   = "1.14.2"
kubelogin   = "1.36.2"
"github:radiusmethod/kxd" = "0.2.0"  # kubeconfig file switcher (kxd init in .zshrc)

# --- Cloud (pinned) ---
azure       = "2.87.0"

# --- Development ---
node        = "lts"

# --- Shell / Tools (pinned — used on every shell start) ---
direnv      = "2.37.1"   # eval "$(direnv hook zsh)" in .zshrc
fzf         = "0.74.0"
yq          = "4.53.3"
jq          = "1.8.1"
usage       = "3.6.0"    # Shell completion helper for mise
ripgrep     = "15.2.0"   # rg: fast grep; `rgf` in fzf.zsh
eza         = "0.23.5"   # ls replacement with git/tree support (fzf previews)
delta       = "0.20.1"   # git pager (git/.gitconfig, lazygit)
lazygit     = "0.66.2"   # git TUI (lg)
zoxide      = "0.10.0"   # smarter cd (z / zi)
neovim      = "0.11.7"   # init.lua needs 0.10+ (Ubuntu 22.04 apt ships 0.6)

# --- Repo quality gates (pinned — used by pre-commit hooks and CI) ---
gitleaks    = "8.30.1"   # secret scanner (.pre-commit-config.yaml, CI)
shellcheck  = "0.11.0"
shfmt       = "3.14.1"
pre-commit  = "4.7.0"

# --- Shell / Tools (latest — update via `mise upgrade` when convenient) ---
jqp         = "latest"   # jq playground TUI
dotenvx     = "latest"
uv          = "latest"

# --- Misc (latest) ---
qdns        = "latest"
"github:s3tools/s3cmd" = "latest"
pipx        = "latest"
azure-kubelogin = "latest"
python = "latest"
velero = "1.18.1"
