name: AI rules

on:
  push:
    paths:
      - 'ai/**'
      - '.claude/rules/**'
      - '.cursor/rules/**'
      - 'claude/**'
      - 'opencode/.config/opencode/global-rules.md'
      - '.github/workflows/ai-rules.yml'
  pull_request:
    paths:
      - 'ai/**'
      - '.claude/rules/**'
      - '.cursor/rules/**'
      - 'claude/**'
      - 'opencode/.config/opencode/global-rules.md'
      - '.github/workflows/ai-rules.yml'

jobs:
  in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Claude / Cursor / opencode copies must match their sources in ai/.
      - name: Check that generated rules are up to date
        run: ai/sync --check
