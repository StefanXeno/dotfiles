name: AI rules

on:
  push:
    paths:
      - 'ai/**'
      - '.claude/rules/**'
      - '.cursor/rules/**'
      - 'claude/**'
      - 'opencode/.config/opencode/global-rules.md'
      - '.github/workflows/ai-rules.yml'
  pull_request:
    paths:
      - 'ai/**'
      - '.claude/rules/**'
      - '.cursor/rules/**'
      - 'claude/**'
      - 'opencode/.config/opencode/global-rules.md'
      - '.github/workflows/ai-rules.yml'

jobs:
  in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The Claude / Cursor / opencode copies must match their sources in ai/.
      - name: Check that generated rules are up to date
        run: ai/sync --check
