name: AI rules

on:
  push:
    paths:
      - 'ai/**'
      - '.claude/rules/**'
      - '.cursor/rules/**'
      - 'claude/**'
      - 'opencode/.config/opencode/global-rules.md'
      - '.github/workflows/ai-rules.yml'
  pull_request:
    paths:
      - 'ai/**'
      - '.claude/rules/**'
      - '.cursor/rules/**'
      - 'claude/**'
      - 'opencode/.config/opencode/global-rules.md'
      - '.github/workflows/ai-rules.yml'

jobs:
  in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The Claude / Cursor / opencode copies must match their sources in ai/.
      - name: Check that generated rules are up to date
        run: ai/sync --check
