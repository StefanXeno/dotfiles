name: Shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.zsh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**.sh'
      - '**.zsh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run shellcheck on bash scripts
        run: |
          find . -type f -name '*.sh' ! -path './.git/*' -print0 \
            | xargs -0 -r shellcheck -x

      - name: Run shellcheck on zsh modules (bash-compatible subset)
        run: |
          shellcheck -x -s bash \
            zsh/.zsh/aliases.zsh \
            zsh/.zsh/fzf.zsh \
            zsh/.zsh/k9s-functions.zsh
