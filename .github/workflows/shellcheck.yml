name: Shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.zsh'
      - 'zsh/bin/notify-send'
      - 'zsh/bin/ollama-menu'
      - 'zsh/bin/ollama-ai'
      - 'zsh/bin/claude-usage'
      - 'zsh/bin/tmux-ai-status'
      - 'ai/sync'
      - 'ai/link-skills'
      - 'zsh/bin/wt-settings'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**.sh'
      - '**.zsh'
      - 'zsh/bin/notify-send'
      - 'zsh/bin/ollama-menu'
      - 'zsh/bin/ollama-ai'
      - 'zsh/bin/claude-usage'
      - 'zsh/bin/tmux-ai-status'
      - 'ai/sync'
      - 'ai/link-skills'
      - 'zsh/bin/wt-settings'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck on bash scripts
        run: |
          find . -type f -name '*.sh' ! -path './.git/*' -print0 \
            | xargs -0 -r shellcheck -x

      - name: Run shellcheck on zsh modules (bash-compatible subset)
        run: |
          shellcheck -x -s bash \
            zsh/.zsh/aliases.zsh \
            zsh/.zsh/cheatsheets.zsh \
            zsh/.zsh/fzf.zsh \
            zsh/.zsh/k9s-functions.zsh \
            zsh/.zsh/ollama.zsh \
            zsh/.zsh/tmux.zsh

      - name: Run shellcheck on zsh/bin scripts
        run: shellcheck -x zsh/bin/notify-send zsh/bin/ollama-menu zsh/bin/ollama-ai zsh/bin/wt-settings zsh/bin/claude-usage zsh/bin/tmux-ai-status ai/sync ai/link-skills
